name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run verify
      - run: npm run check:env -- --strict
        env:
          APP_ENV: local
          AUTH_MODE: local
          DATABASE_URL: file:./dev.db
