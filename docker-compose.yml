services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: contratos
      POSTGRES_USER: contratos
      POSTGRES_PASSWORD: contratos
    ports:
      - "5432:5432"
    volumes:
      - contratos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contratos -d contratos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contratos_pg:
